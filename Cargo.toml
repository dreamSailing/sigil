[package]
name = "sig"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/DreamSailing/sigil"
description = "A UI framework designed for AI agents"
keywords = ["ui", "framework", "ai", "agent", "tsx"]
categories = ["web-programming", "command-line-utilities"]

[[bin]]
name = "sig"
path = "src/main.rs"

[dependencies]
# 核心编译器：使用 SWC (Stable Version)
swc_core = { version = "0.87.0", features = ["common", "ecma_ast", "ecma_parser", "ecma_visit", "ecma_codegen", "ecma_transforms", "ecma_transforms_typescript"] }
# 固定 serde 版本以解决 swc_common 的 __private 导入错误
serde = "=1.0.204"
# Web 服务器与异步运行时
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["compression-gzip", "fs"] }
# SSE support
async-stream = "0.3"
# CLI 工具
clap = { version = "4.0", features = ["derive"] }
# 文件监听
notify = "6.0"
# 错误处理
anyhow = "1.0"
# 正则表达式 (import rewriting)
regex = "1"
sourcemap = "9.3.2"
base64 = "0.22.1"
serde_json = "1.0.120"
