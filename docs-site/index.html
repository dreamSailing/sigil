<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigil — 专为 AI Agent 设计的前端框架</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
    <script>
        // Dev mode: enable error overlay and live reload
        window.SIGIL_DEV = true;
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
            // Catch module loading errors
            window.addEventListener('error', function(e) {
                if (e.message && e.message.includes('Compile Error')) {
                    showDevError(e.message.replace('Compile Error: ', ''));
                }
            });
            // SSE live reload with error detection
            var es = new EventSource('/@reload');
            es.onmessage = function(e) {
                if (e.data === 'reload') {
                    location.reload();
                }
            };
            es.onerror = function() {
                es.close();
            };
            // Dev error overlay
            function showDevError(msg) {
                var overlay = document.getElementById('__sigil-error-overlay');
                if (!overlay) {
                    overlay = document.createElement('div');
                    overlay.id = '__sigil-error-overlay';
                    overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;font-family:monospace;';
                    overlay.innerHTML = '<div style="max-width:800px;width:100%;background:#1a1a2e;border:2px solid #ef4444;border-radius:12px;padding:24px;color:#e2e8f0;max-height:80vh;overflow:auto;"><h3 style="color:#ef4444;margin:0 0 16px;font-size:18px;">⚠ Compile Error</h3><pre style="margin:0;white-space:pre-wrap;font-size:14px;line-height:1.6;color:#fca5a5;"></pre><p style="margin:16px 0 0;font-size:12px;color:#64748b;">Fix the error and the page will auto-reload.</p></div>';
                    document.body.appendChild(overlay);
                }
                overlay.querySelector('pre').textContent = msg;
                overlay.style.display = 'flex';
            }
        }
    </script>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
